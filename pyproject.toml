[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corva-api-client"
version = "0.1.0"
description = "Lightweight Python SDK for Corva API."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Bryan Ray" }]
maintainers = [{ name = "Bryan Ray" }]
keywords = ["corva", "sdk", "api", "data", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["httpx>=0.28.1", "jsonschema>=4.25.1", "pymongo>=4.16.0"]

[project.urls]
Repository = "https://github.com/bryansray/corva-api-client"
Issues = "https://github.com/bryansray/corva-api-client/issues"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
    "ty>=0.0.31",
    "twine>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corva_api_client" = ["schemas/*.json"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]
